singleQuote: true
jsxSingleQuote: true
printWidth: 90

plugins:
  - prettier-plugin-jsdoc
  - prettier-plugin-toml

tsdoc: true

overrides:
  - { files: '*.jsonc', options: { trailingComma: none } }
  - {
      files: '_/vscode/keybindings.json',
      options: { printWidth: 100, objectWrap: collapse },
    }
