useGitignore: true
allowCompoundWords: true
ignorePaths:
  - _/firefox/
  - _/git/
  - _/starship/starship.toml
  - _/vim/.vimrc
  - _/vscode/settings.json
  - '*-lock.json'
  - '*.dockerfile'
  - biome.jsonc
  - Dockerfile
words:
  - chsh
  - clippy
  - ctison
  - dotenv
  - fnox
  - ipsw
  - kreuzberg
  - kreuzcrawl
  - mkcd
  - msgpackz
  - nistp
  - nuon
  - nushell
  - nvim
  - ollama
  - osascript
  - pkgs
  - psub
  - pulumi
  - qwen
  - shopt
  - surrealdb
  - surrealkv
  - tombi
  - vimrc
ignoreRegExpList:
  - \bcom(\.\w+)+\b
  - \'aqua:\w+/\w+\'
